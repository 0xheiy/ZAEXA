# پیکربندی انتشار روی Cloudflare Workers (static assets).
#
# چرا این فایل در مخزن است و نه فقط در پنل کلادفلر: تنظیماتی که فقط با کلیک
# ساخته شده باشد، نه تاریخچه دارد نه قابل بازتولید است. اگر روزی حساب عوض
# شود یا کسی چیزی را در پنل دست بزند، هیچ‌جا معلوم نیست قبلاً چه بود.
#
# در پنل، Build command باید این باشد:
#   mkdir -p _site && cp web/index.html web/ethers.umd.min.js _site/
#
# فقط همان دو فایل منتشر می‌شوند. اگر کل پوشه‌ی web/ را می‌دادیم،
# web/test/stub-ethers.js هم بالا می‌رفت — یک «ethers قلابی» که از دامنه‌ی
# خودمان سرو شود، روی سایتی که کارش امضای تراکنش است، ظاهر خوبی ندارد.

name = "zaexa"
compatibility_date = "2026-08-10"

# اسکریپت Worker فقط برای مسیر /gt است — پراکسی GeckoTerminal.
# هر مسیر دیگری همچنان مستقیم از فایل‌های ثابت سرو می‌شود؛ وقتی یک آدرس با
# فایلی در _site جور دربیاید، Worker اصلاً اجرا نمی‌شود.
main = "worker/index.js"

[assets]
directory = "./_site"
# بایندینگ لازم است تا Worker بتواند برای مسیرهای غیر از /gt خودِ فایل‌های
# ثابت را برگرداند.
binding = "ASSETS"
