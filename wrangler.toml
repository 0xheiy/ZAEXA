# پیکربندی انتشار روی Cloudflare Workers (static assets).
#
# چرا این فایل در مخزن است و نه فقط در پنل کلادفلر: تنظیماتی که فقط با کلیک
# ساخته شده باشد، نه تاریخچه دارد نه قابل بازتولید است. اگر روزی حساب عوض
# شود یا کسی چیزی را در پنل دست بزند، هیچ‌جا معلوم نیست قبلاً چه بود.
#
# در پنل، Build command باید این باشد:
#   mkdir -p _site && cp web/index.html web/_headers web/*.js _site/
#
# گلوب `web/*.js` عمدی است: باندل‌های وندور حالا نامشان هشِ محتوایشان را دارد
# (مثل ethers.umd.min.fd66c046.js)، پس هر بار بازسازی شدند و هششان عوض شد،
# همین خط بدون دست‌خوردن همان فایل تازه را برمی‌دارد — دیگر لازم نیست کسی
# هر بار به یاد بیاورد این خط را هم عوض کند.
# `web/*.js` هنوز نمی‌تواند web/test/stub-ethers.js را بردارد چون آن یک پوشه
# پایین‌تر است — یک «ethers قلابی» که از دامنه‌ی خودمان سرو شود، روی سایتی که
# کارش امضای تراکنش است، ظاهر خوبی ندارد.
# `web/_headers` هم باید کپی شود، وگرنه قاعده‌ی کش‌شدنِ immutable در همان فایل
# (پایین‌تر توضیح داده شده) بی‌صدا هیچ اثری نمی‌کند — نه خطا، فقط کش پیش‌فرض
# کلادفلر که هر بار اعتبارسنجی می‌خواهد.

name = "zaexa"
compatibility_date = "2026-08-10"

# اسکریپت Worker دو مسیر دارد: /gt (پراکسی GeckoTerminal) و /ev (شمارش رویداد).
# هر مسیر دیگری همچنان مستقیم از فایل‌های ثابت سرو می‌شود؛ وقتی یک آدرس با
# فایلی در _site جور دربیاید، Worker اصلاً اجرا نمی‌شود — و همین دلیلی است که
# شمارش بازدید باید از خودِ صفحه بیاید، نه از سمت سرور.
main = "worker/index.js"

# لاگ Worker. تا امروز خطای سمت سرور روی /gt و /ev و /t/ هیچ‌جا نمی‌ماند —
# یک استثنا در Worker یعنی کاربر ۵۰۰ می‌گیرد و ما هرگز نمی‌فهمیم.
#
# ⚠️ این بلوک باید *در همین فایل* باشد، نه فقط روشن در پنل: هنگام deploy
# پیکربندی این فایل منبع حقیقت است، پس اگر اینجا نباشد می‌تواند چیزی را که
# در پنل روشن بوده خاموش کند — و خاموشی‌اش هیچ خطایی نمی‌دهد.
# نرخ ۱ یعنی همه‌ی درخواست‌ها. ترافیک فعلی کم است و نمونه‌برداری روی عدد کم
# فقط باعث می‌شود همان یک خطای نادری که دنبالش هستیم دیده نشود.
[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./_site"
# بایندینگ لازم است تا Worker بتواند برای مسیرهای غیر از /gt و /ev خودِ
# فایل‌های ثابت را برگرداند.
binding = "ASSETS"

# انبار رویدادها. دیتاست را لازم نیست در پنل دستی بسازی — اولین نوشتن خودش
# می‌سازدش. داده ۳ ماه می‌ماند و بعد خودش پاک می‌شود، پس انباشت دائمی نداریم.
# خواندن با SQL API و توکنی که فقط پیش خودت می‌ماند → scripts/ev_report.sh
[[analytics_engine_datasets]]
binding = "ZX_EV"
dataset = "zaexa_events"
