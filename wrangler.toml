# پیکربندی انتشار روی Cloudflare Workers (static assets).
#
# چرا این فایل در مخزن است و نه فقط در پنل کلادفلر: تنظیماتی که فقط با کلیک
# ساخته شده باشد، نه تاریخچه دارد نه قابل بازتولید است. اگر روزی حساب عوض
# شود یا کسی چیزی را در پنل دست بزند، هیچ‌جا معلوم نیست قبلاً چه بود.
#
# در پنل، Build command باید این باشد:
#   mkdir -p _site && cp web/index.html web/ethers.umd.min.js web/walletconnect.bundle.js _site/
#
# فقط همان سه فایل منتشر می‌شوند. اگر کل پوشه‌ی web/ را می‌دادیم،
# web/test/stub-ethers.js هم بالا می‌رفت — یک «ethers قلابی» که از دامنه‌ی
# خودمان سرو شود، روی سایتی که کارش امضای تراکنش است، ظاهر خوبی ندارد.

name = "zaexa"
compatibility_date = "2026-08-10"

# اسکریپت Worker دو مسیر دارد: /gt (پراکسی GeckoTerminal) و /ev (شمارش رویداد).
# هر مسیر دیگری همچنان مستقیم از فایل‌های ثابت سرو می‌شود؛ وقتی یک آدرس با
# فایلی در _site جور دربیاید، Worker اصلاً اجرا نمی‌شود — و همین دلیلی است که
# شمارش بازدید باید از خودِ صفحه بیاید، نه از سمت سرور.
main = "worker/index.js"

[assets]
directory = "./_site"
# بایندینگ لازم است تا Worker بتواند برای مسیرهای غیر از /gt و /ev خودِ
# فایل‌های ثابت را برگرداند.
binding = "ASSETS"

# ⚠️ صفحه‌ی توکن بدون این خط کار نمی‌کند و دلیلش ظریف است: مسیریابِ فایل‌های
# ثابت **قبل از** Worker اجرا می‌شود. برای /t/<آدرس> هیچ فایلی وجود ندارد،
# پس خودش تصمیم می‌گیرد و ۳۰۷ می‌دهد (قاعده‌ی trailing-slash) — درخواست
# اصلاً به کد ما نمی‌رسد. اندازه‌گیری‌شده روی سایت زنده: پیش از این خط،
#   /t/0x8335… -> 307
# فقط برای همین الگو جای اولویت را عوض می‌کنیم؛ بقیه‌ی سایت مثل قبل مستقیم
# از فایل‌های ثابت می‌آید و Worker برایشان اجرا نمی‌شود.
run_worker_first = ["/t/*"]

# انبار رویدادها. دیتاست را لازم نیست در پنل دستی بسازی — اولین نوشتن خودش
# می‌سازدش. داده ۳ ماه می‌ماند و بعد خودش پاک می‌شود، پس انباشت دائمی نداریم.
# خواندن با SQL API و توکنی که فقط پیش خودت می‌ماند → scripts/ev_report.sh
[[analytics_engine_datasets]]
binding = "ZX_EV"
dataset = "zaexa_events"
